<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080D1E" />
    <script>
      (() => {
        let theme;
        try {
          theme = localStorage.getItem('orbit-theme');
        } catch {
          // Storage can be unavailable in restricted browsing contexts.
        }
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.dataset.theme = theme;
        if (theme === 'light') document.querySelector('meta[name="theme-color"]').content = '#f5f8ff';
      })();
    </script>
    <meta
      name="description"
      content="ORBIT ’26 — a fictional 36-hour student hackathon. Three missions. One extraordinary leap. An original IEEE CS UCSC recruitment concept."
    />
    <meta property="og:title" content="ORBIT ’26 — Beyond the possible." />
    <meta
      property="og:description"
      content="An immersive student hackathon concept. Find your crew. Choose your mission. Build what comes next."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <title>ORBIT ’26 — Beyond the possible.</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript
      >This React experience needs JavaScript. ORBIT ’26 is a fictional student hackathon concept for the IEEE
      CS UCSC recruitment challenge.</noscript
    >
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
